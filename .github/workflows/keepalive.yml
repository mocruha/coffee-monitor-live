name: keepalive
on:
  schedule:
    # 8x/dia, minuto 17 para fugir do congestionamento do :00.
    # O cron do Actions descarta/atrasa slots: com 6h observou-se vão de 14h43m
    # entre execuções (11-2026), o que fura a janela de 12h de hibernação.
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.49.1 && playwright install --with-deps chromium
      - run: python scripts/keepalive.py
