name: keepalive
on:
  schedule:
    - cron: "5 */6 * * *"   # 4x/dia, espaçamento < janela de 12h
  workflow_dispatch: {}
permissions: {}
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.49.1 && playwright install --with-deps chromium
      - run: python scripts/keepalive.py
